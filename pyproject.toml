[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Agentic AI-powered algorithmic trading platform — Phase 1: Data Foundation"
requires-python = ">=3.11"
dependencies = [
    "kiteconnect>=5.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.3.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "pandas-market-calendars>=4.4.0",
    "pyarrow>=15.0.0",
    "apscheduler>=3.10.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "types-redis>=4.6.0",
    "fakeredis>=2.20.0",
]

[project.scripts]
trading = "trading_system.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
